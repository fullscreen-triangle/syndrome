# The term map is your instrument.
#
# The calculus is correct for ANY choice made here (thm:tau-agnostic), so
# nothing below can make a determination unsound. What it decides is which
# distinctions the graph can see — and therefore whether the graph can tell
# your modules apart at all.
#
# Edit, then run `purpose ckg lens` to see what the choice did to the
# structure, and `purpose ckg build` to induce the graph from it.
#
# There is deliberately no score to raise. A lens under which every module
# draws identical distinctions induces among the highest floors while
# discriminating worst. Read component sizes and term spread instead.

[lens]
granularity = "file"   # file | dir — one module per source file, or per directory
floor = 1            # β; every contact carries at least this

[include]
# Which files contribute. Empty means all of them.
# `*` stays within one path segment, `**` crosses them.
paths = [
  "docs/**",
  "publication/**",
  "diseases/**",
  "cause-for-concern/**",
  "syndrome-rs/**",
  "syndrome/**",
]
# monograph/** is EXCLUDED on purpose. It is a consolidation of the papers in
# publication/ and docs/, so every chapter restates a paper's vocabulary and
# contacts that paper's whole neighbourhood. Including it does not add a
# distinction, it duplicates one. Add it back if you are working ON the
# monograph rather than on the papers it draws from.
#
# disco-macabre/** (generated dashboards) and visualizations/** are excluded
# for the same reason: derived artifacts, not sources of distinction.
# Which symbol kinds contribute. Comment out for all of them.
# Known kinds: fn, struct, enum, trait, type, def, class, func, heading, section
# NOTE ON THE KINDS LEVER, for whoever reads this next.
#
# `section` is 3574 of 4709 entries here — 76% of the index. Dropping it is the
# single strongest structural lever available (measured: density 0.432 → 0.062,
# giant component 145 → 42 modules, top term spread 42% → 10%).
#
# It is NOT taken, deliberately. This is a paper repository: the .tex files ARE
# the content, and they carry their meaning in \section titles. Dropping
# `section` costs 98 of 168 modules and leaves syndrome-rs/ and README.md as the
# degree hubs — a structurally cleaner graph of the wrong repository.
#
# The boilerplate is instead removed by name in `stopwords` below, which is
# weaker (0.432 → 0.410) but does not throw the papers away.
#
# kinds = ["heading", "def", "fn", "func", "class", "struct", "enum", "type"]

[terms]
min_len = 3                  # shortest prose token that counts as a distinction
split_camel_case = false      # also emit the pieces of parseRequest, not only the whole
prose_kinds = ["heading", "section"]  # names here are phrases to split, not identifiers

# Tokens too common to distinguish anything. These apply to prose only: a
# `fn over` still defines `over`, because that is a real distinction.
# Add to this list from the TERM SPREAD section of `purpose ckg lens` — the
# terms at the top of it are the ones putting everything in contact.
stopwords = [
  "the", "and", "not", "for", "with", "from", "that", "this",
  "what", "when", "where", "which", "how", "why", "who", "are",
  "was", "were", "has", "have", "had", "can", "will", "its",
  "into", "out", "over", "than", "then", "there", "does", "did",
  "you", "your", "our", "all", "any", "but", "use", "using",
  "used", "via", "per", "about", "also",

  # Paper boilerplate. These are section headings every paper in this repo
  # carries, so they contact every module with every other module and carry
  # no information about what a paper is about.
  "introduction", "conclusion", "conclusions", "discussion", "abstract",
  "background", "overview", "summary", "references", "appendix",
  "methods", "results", "validation", "experimental", "notation",
  "preliminaries", "definitions", "acknowledgments", "motivation",
  "implications", "limitations", "future", "work", "related",
  "problem", "approach", "framework", "analysis", "properties",
  "example", "examples", "remarks", "proof", "proofs", "lemma",
  "theorem", "theorems", "corollary", "proposition", "setup",
  "consequences", "interpretation", "formulation", "derivation",
  "statement", "case", "cases", "general", "basic", "main",
]

# Rename a term wherever it appears, so two spellings become one distinction.
[terms.alias]
# "ckg" = "contact-knowledge-graph"

# What a distinction is worth when telling two modules apart. Patterns match on
# the KIND that contributed the term, first match wins, default 1.0.
# A shared term is worth min(what each module gives it).
[terms.weight]
# "trait:*" = 3.0        # anything a trait declares weighs triple
# "heading:*" = 0.5      # prose weighs half
# "fn:parse" = 2.0       # one exact term from one kind

[edges]
# sum     — Σ min(weights) over shared terms; at unit weights, the shared count
# count   — the shared count, ignoring weights entirely
# jaccard — weighted Jaccard in (0,1]; needs a floor well below 1 or every
#           contact clamps to β and the graph goes flat
weight = "sum"
